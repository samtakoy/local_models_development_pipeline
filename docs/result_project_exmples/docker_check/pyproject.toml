[project]
name = "temperature-converter"
version = "0.1.0"
description = "Flask-приложение для конвертации температур между шкалами Цельсия и Фаренгейта"
requires-python = ">=3.11"
dependencies = [
    "flask",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
