<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        input[type="text"], select, button {
            font-size: 1rem;
            padding: 0.5rem;
            margin: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4a90d9;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #357abd;
        }
        #result {
            margin-top: 1.5rem;
            font-size: 1.25rem;
            color: #333;
        }
        .result {
            color: #2e7d32;
            font-weight: bold;
        }
        .error {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
