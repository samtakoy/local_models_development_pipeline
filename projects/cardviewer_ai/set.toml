[task]
question = """В проекте уже есть локальное веб-приложение для просмотра обучающих карточек: библиотека колод,
темы, просмотр колоды. Формат колоды описан в docs/card_pack_specs.md, пример — docs/card_pack_example.txt.

Нужно добавить сборку новой колоды с помощью ИИ на локальной модели.

Что должно уметь приложение.

Запрос на колоду:
- Пользователь пишет, по какой теме нужна колода, и при желании описывает пожелания: уровень, объём, на что
  сделать упор.
- Пользователь может приложить ссылки на конкретные страницы: материал для карточек берётся из них.
- Пользователь может включить поиск в интернете: тогда материал по теме ищется в сети.
- Если нет ни ссылок, ни поиска, колода собирается из знаний модели.

Сборка колоды:
- Колоду собирает не один запрос к модели, а граф агентов с разделением ролей: один вызов модели с такой
  задачей не справится.
- Роли графа как минимум такие:
  - планирование: разбить тему на подтемы и решить, что должно войти в колоду;
  - сбор материала: найти материал в сети и прочитать приложенные ссылки, выбрать из них факты по подтемам;
  - написание карточек: вопрос и ответ по формату колоды;
  - проверка полноты: все ли подтемы из плана покрыты материалом и карточками;
  - проверка качества: ответы соответствуют собранному материалу, нет выдуманных фактов и противоречий;
  - проверка логичности и понятности: вопрос однозначен, ответ понятен человеку без подготовки,
    карточки идут в разумном порядке.
- Проверка, которая нашла проблемы, возвращает работу на доработку той роли, которая их исправит.
  Число возвратов ограничено, чтобы сборка не шла бесконечно.
- Пока идёт сборка, пользователь видит, на каком она этапе. Сборка может идти несколько минут,
  приложение при этом не зависает.

Результат:
- Готовая колода сохраняется файлом в формате docs/card_pack_specs.md: название, описание, карточки, теги.
- Колода появляется в библиотеке, пользователь выбирает тему, в которую её положить.
- В описании колоды перечислены источники: ссылки, из которых взят материал.
- Если сборка не удалась (модель недоступна, поиск не работает, материал не найден), пользователь
  видит понятное сообщение, что пошло не так. Уже существующие колоды и библиотека не страдают.

Ограничения:
- Модель — локальная, через Ollama. Модель по умолчанию — qwen3.5:9b.
- Адрес Ollama и имя модели задаются переменными окружения, у обоих есть значения по умолчанию.
- Поиск в интернете — без платных сервисов и ключей доступа.
- Граф агентов — на LangGraph.
- Существующие сценарии приложения продолжают работать.
- Тесты не обращаются к модели и к сети: модель и поиск в тестах подменяются.

Целевая аудитория:
- обычный пользователь без технического образования, который хочет быстро получить колоду карточек
  по интересной ему теме.

Готово, когда:
- сборка колоды запускается из приложения и доводит до колоды в библиотеке по теме, по ссылкам
  и с поиском в интернете;
- README.md описывает, как поставить и запустить Ollama с моделью и как собрать колоду;
- граф агентов, сохранение колоды и обработка ошибок покрыты тестами, тесты проходят."""

