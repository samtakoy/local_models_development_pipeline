services:
  codeteam:
    # Собирает образ по Dockerfile из этой папки и называет его codeteam
    build: .
    image: codeteam

    # Процесс номер 1 — уборщик tini: забирает завершившиеся фоновые процессы агентов
    init: true

    environment:
      # Ollama на Mac, адрес из контейнера
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Часовой пояс машины: имена папок прогонов и время в журналах — по местному времени
      TZ: ${TZ:-UTC}
      # Браузер Playwright MCP: Chromium из образа, без песочницы Chromium (в контейнере всё работает от root)
      PLAYWRIGHT_MCP_BROWSER: chromium
      PLAYWRIGHT_MCP_NO_SANDBOX: "true"
      # Автор коммитов codeteam в проекте агентов
      GIT_AUTHOR_NAME: codeteam
      GIT_AUTHOR_EMAIL: codeteam@localhost
      GIT_COMMITTER_NAME: codeteam
      GIT_COMMITTER_EMAIL: codeteam@localhost

    volumes:
      # Папка codeteam: код, .env, прогоны
      - .:/app
      # Проект агентов в томе docker по пути, который видит codeteam в контейнере.
      # В папку Mac песочница Landlock писать не даёт (Docker Desktop), в том — даёт
      - project:${PROJECT_CONTAINER_DIR:?запускайте через run_docker.sh}
      # Кэш скачанных пакетов uv между запусками; только папка uv: рядом в /root/.cache лежит Chromium
      - uv_cache:/root/.cache/uv

  # Копирует проект агентов между папкой Mac и томом: аргументы запуска — аргументы rsync
  sync:
    build: .
    image: codeteam
    entrypoint: ["rsync"]
    volumes:
      # Проект агентов на Mac
      - ${PROJECT_HOST_DIR:?запускайте через run_docker.sh}:/host_project
      # Тот же том, что у codeteam
      - project:/volume_project

# Именованные тома: хранит Docker, живут дольше контейнеров
volumes:
  # Том проекта агентов: свой у каждого проекта, имя задаёт run_docker.sh
  project:
    name: ${PROJECT_VOLUME:?запускайте через run_docker.sh}
  uv_cache:
